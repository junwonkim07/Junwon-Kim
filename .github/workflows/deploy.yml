name: Deploy

# Only main. Pull requests build through the branch protection checks, but the
# origin is a live box and nothing unreviewed should reach it.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a second push mid-rsync would interleave file writes.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version here: package.json's packageManager field pins it, and
      # declaring it twice makes the action refuse to run.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # output: "export" writes the whole site to out/.
      - run: pnpm build

      - name: Publish to the origin
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ vars.DEPLOY_HOST }}
          USER: ${{ vars.DEPLOY_USER }}
          TARGET: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail

          test -s out/index.html || { echo "out/ is empty — refusing to deploy"; exit 1; }

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # --delete so removed pages actually disappear from the origin. It is
          # scoped to the site directory, which holds nothing else.
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes" \
            out/ "$USER@$HOST:$TARGET/"

      # Checks the origin directly with a Host header rather than the public
      # URL. Cloudflare answers 403 to the runner's datacenter IP, and the point
      # is to prove what was just published is being served — not to test the
      # edge or whatever it happens to have cached.
      - name: Check the origin serves the new build
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          SITE: ${{ vars.DEPLOY_URL }}
        run: |
          set -euo pipefail
          domain=${SITE#https://}
          for path in / /blog/ /resume/ /sitemap.xml; do
            body=$(curl -sS --max-time 30 -H "Host: $domain" "http://$HOST$path")
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -H "Host: $domain" "http://$HOST$path")
            echo "$path -> $code ($(printf '%s' "$body" | wc -c) bytes)"
            [ "$code" = "200" ] || exit 1
            # A 200 on an empty or default page would still pass a status check.
            case "$path" in
              *.xml) printf '%s' "$body" | grep -q "<urlset" || { echo "  not a sitemap"; exit 1; } ;;
              *)     printf '%s' "$body" | grep -q "Junwon Kim" || { echo "  page body is not the site"; exit 1; } ;;
            esac
          done
